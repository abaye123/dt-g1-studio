[package]
name = "dt-g1-studio-app"
description = "DT G1 Studio desktop app (Tauri shell over watch-core)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "dt_g1_studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
watch-core = { path = "../crates/watch-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
base64 = "0.22"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
