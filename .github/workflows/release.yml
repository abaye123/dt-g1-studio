name: release

# Build and publish installers on every version tag. The job assembles the
# bundled tools (gx toolchain, map compiler on Windows, launcher) with the
# vendor script, then builds the Tauri app. The release is created as a draft
# prerelease; the Windows installer is signed locally afterwards with
# scripts/sign-and-publish.ps1 before the release is published.

on:
  push:
    tags:
      - "v*"

# Allow the workflow to create the release and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            vendor: pwsh scripts/vendor.ps1
            args: "--bundles nsis"
          - os: ubuntu-22.04
            vendor: bash scripts/vendor.sh
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf zip libudev-dev

      - name: Assemble bundled tools
        run: ${{ matrix.vendor }}

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "DT G1 Studio ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/portable.ps1

      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/portable.sh

      - name: Upload portable zip to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" DT-G1-Studio-*-portable-*.zip --clobber
