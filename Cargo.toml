[workspace]
resolver = "2"
members = ["crates/watch-core", "src-tauri"]

# The Tauri app crate (src-tauri) is added in a later step and will be listed here.

[workspace.package]
version = "0.3.0"
edition = "2021"
license-file = "LICENSE"
authors = ["abaye"]

[profile.release]
strip = true
lto = true

# The audio codecs are far too slow unoptimized; build them with optimizations
# even in dev builds so music encoding stays fast.
[profile.dev.package.mp3lame-sys]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
