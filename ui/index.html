<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DT G1 Studio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">G1</span>
        <span class="brand-name">DT G1 Studio</span>
      </div>
      <div class="header-actions">
        <button id="demoToggle" class="icon-btn" type="button" title="Demo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-4.5 8A2 2 0 0 0 7.3 20h9.4a2 2 0 0 0 1.8-3L14 9V3"/></svg>
        </button>
        <button id="themeToggle" class="icon-btn" type="button" title="Theme" aria-label="Theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="langToggle" class="lang-btn" type="button">EN</button>
      </div>
    </header>

    <aside class="sidebar">
      <button class="nav-item active" data-tab="connect" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/></svg>
        <span data-i18n="tab.connect"></span>
      </button>
      <button class="nav-item" data-tab="partition" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span data-i18n="tab.partition"></span>
      </button>
      <button class="nav-item" data-tab="menu" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span data-i18n="tab.menu"></span>
      </button>
      <button class="nav-item" data-tab="background" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span data-i18n="tab.background"></span>
      </button>
      <div class="nav-sep"></div>
      <div class="nav-hint" data-i18n="nav.hint"></div>
    </aside>

    <main>
      <div id="demoBanner" class="demo-banner" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-4.5 8A2 2 0 0 0 7.3 20h9.4a2 2 0 0 0 1.8-3L14 9V3"/></svg>
        <span data-i18n="demo.banner"></span>
        <button id="demoOff" class="demo-off" type="button" data-i18n="demo.off"></button>
      </div>

      <section id="tab-connect" class="panel active">
        <h1 data-i18n="connect.title"></h1>
        <p class="lead" data-i18n="connect.intro"></p>

        <div class="card">
          <div class="status-head">
            <span class="dot" id="statusDot"></span>
            <span class="status-text" id="statusText" data-i18n="connect.unknown"></span>
          </div>
          <p class="guide" id="guideText"></p>
        </div>

        <div class="actions">
          <button id="detectBtn" class="btn primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/></svg>
            <span data-i18n="connect.detect"></span>
          </button>
          <button id="pingBtn" class="btn" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span data-i18n="connect.test"></span>
          </button>
        </div>

        <pre id="log" class="log" aria-live="polite"></pre>

        <div class="safe-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span data-i18n="footer.safe"></span>
        </div>
      </section>

      <section id="tab-partition" class="panel">
        <h1 data-i18n="partition.title"></h1>
        <p class="lead" data-i18n="partition.intro"></p>
        <div class="info-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span data-i18n="partition.drive_note"></span>
        </div>
        <div class="actions">
          <button id="exposeBtn" class="btn primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span data-i18n="partition.open"></span>
          </button>
          <button id="partExplorer" class="btn" type="button" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8M12 9l4 4-4 4"/></svg>
            <span data-i18n="partition.explorer"></span>
          </button>
          <button id="partRefresh" class="btn" type="button" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
            <span data-i18n="partition.refresh"></span>
          </button>
        </div>
        <p id="partMsg" class="coming"></p>
        <div id="partBrowser" class="browser" style="display:none">
          <div class="breadcrumb" id="partCrumb"></div>
          <div class="filelist" id="partList"></div>
        </div>
      </section>

      <section id="tab-menu" class="panel">
        <h1 data-i18n="menu.title"></h1>
        <p class="lead" data-i18n="menu.intro"></p>
        <div class="actions">
          <button id="menuLoad" class="btn primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
            <span data-i18n="menu.load"></span>
          </button>
          <button id="menuSave" class="btn" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            <span data-i18n="menu.save"></span>
          </button>
        </div>
        <p id="menuMsg" class="coming"></p>
        <div id="menuList" class="menu-list" style="display:none"></div>
        <div id="menuRestart" class="safe-note" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          <span data-i18n="menu.restart"></span>
        </div>
      </section>

      <section id="tab-background" class="panel">
        <h1 data-i18n="bg.title"></h1>
        <p class="lead" data-i18n="bg.intro"></p>

        <div class="bg-editor">
          <div class="bg-preview">
            <div class="bg-frame" id="bgFrame">
              <img id="bgImg" alt="" />
              <span class="bg-placeholder" id="bgPlaceholder" data-i18n="bg.pick_hint"></span>
            </div>
          </div>
          <div class="bg-controls">
            <label class="btn primary" for="bgInput">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg>
              <span data-i18n="bg.pick"></span>
            </label>
            <input id="bgInput" type="file" accept="image/*" hidden />

            <div class="bg-fit" id="bgFit">
              <button class="chip active" data-fit="cover" type="button" data-i18n="bg.cover"></button>
              <button class="chip" data-fit="contain" type="button" data-i18n="bg.contain"></button>
            </div>

            <button id="bgApply" class="btn" type="button" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              <span data-i18n="bg.apply"></span>
            </button>
          </div>
        </div>
        <p id="bgMsg" class="coming"></p>
        <div id="bgDone" class="safe-note" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          <span data-i18n="bg.done"></span>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
